services:
  thread-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thread-service-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=supersecret_thread_service_jwt_key_2026
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    volumes:
      - thread_data:/app/prisma

volumes:
  thread_data:
